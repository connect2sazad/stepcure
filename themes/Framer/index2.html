<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Split Cube Scroll Animation</title>
  <link rel="stylesheet" href="https://projects.lyncdigit.com/stepcure/themes/LT-367/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>Menu Here</header>

  <section class="products-details">
    <div class="scroll-content">

      <!-- Section 1 -->
      <div class="section parallax-section" data-title="Baptisia">
        <div class="row full-dimensions">
          <div class="col-12 col-xl-6 cube-col cube-down">
            <div class="cube-inner">
              <img src="./images/baptisia1.png" alt="img">
            </div>
          </div>
          <div class="col-12 col-xl-6 cube-col cube-up">
            <div class="cube-inner">
              <div class="badge badge-primary">Women's Footwear</div>
              <p class="display-3 mt-2">Baptisia</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Section 2 -->
      <div class="section parallax-section" data-title="Features">
        <div class="row full-dimensions">
          <div class="col-12 col-xl-6 cube-col cube-up">
            <div class="cube-inner">
              <div class="badge badge-primary">Features</div>
              <p class="display-3 mt-2">All Day Comfort</p>
            </div>
          </div>
          <div class="col-12 col-xl-6 cube-col cube-down">
            <div class="cube-inner">
              <img src="./images/baptisia2.png" alt="img">
            </div>
          </div>
        </div>
      </div>

      <!-- Section 3 -->
      <div class="section parallax-section" data-title="Slide 3">
        <div class="row full-dimensions">
          <div class="col-12 col-xl-6 cube-col cube-down">
            <div class="cube-inner">
              <img src="./images/baptisia3.png" alt="img">
            </div>
          </div>
          <div class="col-12 col-xl-6 cube-col cube-up">
            <div class="cube-inner">
              <div class="badge badge-primary">Women's Footwear</div>
              <p class="display-3 mt-2">Baptisia</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Section 4 -->
      <div class="section parallax-section" data-title="Slide 4">
        <div class="row full-dimensions">
          <div class="col-12 col-xl-6 cube-col cube-up">
            <div class="cube-inner">
              <div class="badge badge-primary">Features</div>
              <p class="display-3 mt-2">All Day Comfort</p>
            </div>
          </div>
          <div class="col-12 col-xl-6 cube-col cube-down">
            <div class="cube-inner">
              <img src="./images/baptisia4.png" alt="img">
            </div>
          </div>
        </div>
      </div>

      

    </div>

    <!-- Scroll indicator (hidden on mobile in CSS) -->
    <div class="scroll-indicator">
      <div class="scroll-indicator-effect">
        <div class="thin-line"></div>
        <div class="thick-line"></div>
      </div>
      <div class="scroll-thumb">
        <div class="scroll-label">Baptisia</div>
      </div>
    </div>
  </section>

  <footer>Footer Here</footer>
  <script src="script.js"></script>
</body>
</html>
