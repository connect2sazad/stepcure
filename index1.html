<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StepCure - Coming Soon</title>
  <style>
    :root {
      --cream: #F1F0E2;
      --pistachio: #91B07C;
      --green-dark: #556B2F;
      --green-mid: #6B8E23;
      --green-light: #A2C579;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--cream);
      color: var(--green-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 3em;
      color: var(--green-mid);
    }

    p {
      font-size: 1.2em;
      max-width: 500px;
      margin: 20px auto;
    }

    .logo {
      font-size: 1.5em;
      font-weight: bold;
      color: var(--pistachio);
      margin-bottom: 20px;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.9em;
      color: var(--green-light);
    }

    .dot-loader {
      display: flex;
      gap: 8px;
      margin-top: 30px;
      justify-content: center;
    }

    .dot {
      width: 12px;
      height: 12px;
      background-color: var(--green-mid);
      border-radius: 50%;
      animation: blink 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        transform: scale(0);
      } 40% {
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="logo">StepCure</div>
  <h1>We're Under Construction</h1>
  <p>Your step towards better foot health will begin soon. Our custom footwear, insoles, and advanced care are coming your way!</p>

  <div class="dot-loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="footer">© 2025 StepCure. All rights reserved.</div>

</body>
</html>
